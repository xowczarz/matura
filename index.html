<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chemia rozszerzona — notatki</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f5f7fb;color:#18202a}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4e7ec;padding:14px 22px;z-index:5}.topbar{max-width:1500px;margin:auto;display:flex;gap:18px;align-items:center}.brand{font-weight:800;white-space:nowrap}.brand small{display:block;color:#667085;font-size:11px;font-weight:500}.search{flex:1}.search input{width:100%;box-sizing:border-box;padding:12px 16px;border:1px solid #ddd;border-radius:12px}.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:290px 1fr;gap:22px;padding:22px}aside,.chapter,.hero{background:#fff;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 6px 24px #10182812}aside{padding:14px;position:sticky;top:78px;height:fit-content;max-height:calc(100vh - 110px);overflow:auto}.nav-title{font-size:12px;text-transform:uppercase;color:#667085;font-weight:700;padding:8px}.nav a{display:block;text-decoration:none;padding:8px 10px;border-radius:8px;color:#18202a;font-size:13px}.nav a:hover{background:#eef2ff;color:#315efb}.hero{padding:28px;margin-bottom:16px}.hero h1{margin:0 0 8px}.hero p{line-height:1.5;color:#475467}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:8px 11px;background:#f8fafc;border-radius:9px;font-size:13px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.chapter{margin-bottom:14px;overflow:hidden;scroll-margin-top:90px}.chapter-head{display:flex;align-items:center;gap:13px;padding:18px 20px;cursor:pointer}.badge{min-width:44px;height:34px;display:grid;place-items:center;border-radius:9px;background:#eef2ff;color:#2948c7;font-weight:800}.chapter h2{font-size:17px;margin:0;line-height:1.3}.count{margin-left:auto;color:#667085;font-size:12px}.arrow{color:#667085;font-size:18px}.chapter.open .arrow{transform:rotate(90deg)}.chapter-body{display:none;border-top:1px solid #e4e7ec;padding:16px 20px 20px}.chapter.open .chapter-body{display:block}.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.note-card{border:1px solid #b7e4cb;background:#ecfdf3;border-radius:12px;padding:14px}.note-card h3{margin:0 0 10px;font-size:14px;color:#087443}.note-actions{display:flex;gap:7px;flex-wrap:wrap}.note-actions button,.note-actions a{border:0;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;text-decoration:none}.note-actions button{background:#087443;color:white}.note-actions a{background:#fff;color:#087443;border:1px solid #a8d9be}.no-notes{color:#667085;font-size:12px}.empty{display:none;padding:35px;text-align:center}.viewer{display:none;position:fixed;inset:0;z-index:50;background:#0f172ab8;padding:22px}.viewer.open{display:flex;align-items:center;justify-content:center}.viewer-box{width:min(1200px,96vw);height:min(92vh,900px);background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.viewer-head{height:52px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #e4e7ec}.viewer-head strong{flex:1}.close{border:1px solid #ddd;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.viewer iframe{border:0;width:100%;height:100%}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}aside{position:relative;top:auto;max-height:300px}.topbar{flex-wrap:wrap;padding:11px 12px}.brand{width:100%}}
</style></head><body><header><div class="topbar"><div class="brand">Chemia rozszerzona<small>notatki + podstawa programowa</small></div><div class="search"><input id="search" type="search" placeholder="Szukaj tematu, np. izotopy, elektrochemia, alkeny…"></div></div></header><div class="layout"><aside><div class="nav-title">Tematy</div><nav class="nav" id="nav"></nav></aside><main><section class="hero"><h1>Notatki z chemii — szybki dostęp</h1><p>Tematy są uporządkowane według podstawy programowej. Pliki z notatkami są przypisane do odpowiedniego działu.</p><div class="stats"><div class="stat"><b>22</b> działy</div><div class="stat"><b>33</b> pliki z notatkami</div></div></section><div class="toolbar"><button onclick="openAll()">Rozwiń wszystkie</button><button onclick="closeAll()">Zwiń wszystkie</button><button onclick="showOnlyNotes()">Pokaż tylko działy z notatkami</button><button onclick="resetFilter()">Pokaż wszystkie</button></div><div id="chapters"></div><div class="empty" id="empty">Nie znaleziono pasującego tematu.</div></main></div><div class="viewer" id="viewer"><div class="viewer-box"><div class="viewer-head"><strong id="viewerTitle">Notatki</strong><button class="close" onclick="closeViewer()">Zamknij ✕</button></div><iframe id="pdfFrame" title="Podgląd PDF"></iframe></div></div><script>
// Nazwy plików są dokładnie takie jak w folderze notatki. encodeURIComponent zabezpiecza ścieżki przed spacjami i znakami specjalnymi.
const notes=[
['I','01_I._1-3_budowa_atomu_nuklidy_izotopy_liczba_masowa_i_atomowa_s_rednia_masa_atomowa.pdf','Budowa atomu — nuklidy, izotopy, liczba masowa i atomowa, średnia masa atomowa'],
['II','02_II._1-4_konfiguracja_elektronowa_liczby_kwantowe_orbitale.pdf','Konfiguracja elektronowa, liczby kwantowe i orbitale'],
['III','03_III._1-8_wiazania_chemiczne_oddzialywania_miedzyczasteczkowe.pdf','Wiązania chemiczne i oddziaływania międzycząsteczkowe'],
['IV','04_IV._1-9_kinetyka_statystyka_energetyka.pdf','Kinetyka, statyka chemiczna i energetyka'],
['V','05_V._roztwory_st_cenia_rozpuszczalnosc.pdf','Roztwory — stężenia i rozpuszczalność'],
['V','V.; VIII.(hydraty) .pdf','V + VIII — hydraty'],
['VI','VI. (miareczkowanie, odczyn soli).pdf','Miareczkowanie, odczyn soli'],
['VI','VI. 1-5, 7 (pH, pOH, Ka, Kb, Kw, stopień dysocjacji, stała dysocjacji, prawo rozcieńczeń Ostwalda, odczyn soli, hydroliza soli).pdf','pH, pOH, Ka, Kb, Kw, dysocjacja, Ostwald, hydroliza soli'],
['VI','VI. 1-5, 9 (szybkość reakcji, średnia szybkość reakcji, równanie kinetyczne, rząd reakcji, stała szybkości reakcji, entalpia reakcji, wykres energetyczny reakcji, reakcje egzoenergetyczne i endoenergetyczne).pdf','Szybkość reakcji, równanie kinetyczne i entalpia'],
['VI','VI. 3-4, 6-7 (miareczkowanie).pdf','Miareczkowanie'],
['VI','VI. 3, 7 (kwasy i zasady Brønsteda, Ka, Kb, Kw, odczyn soli, roztwory buforowe).pdf','Kwasy i zasady Brønsteda, bufory'],
['VI','VI. 6 (reakcje kwasów z zasadami).pdf','Reakcje kwasów z zasadami'],
['VII','VII. 4, 5, 8; X. 4 (amfoteryczność, związki kompleksowe).pdf','Amfoteryczność i związki kompleksowe'],
['VII','VII. 6; X. 4-5 (reakcje metali z kwasami i zasadami, potencjał standardowy redukcji, przewidywanie biegu reakcji na podstawie potencjałów).pdf','Metale z kwasami i zasadami, potencjały standardowe'],
['VIII','VIII. 1-2, 4-5 (stopnie utlenienia, reakcje redoks, reakcje utlenienia i redukcji, utleniacz, reduktor).pdf','Stopnie utlenienia i reakcje redoks'],
['VII','VIl. 4, 10; VIII. 6; X. 4-5 (reakcje metali z kwasami, kwasy utleniające, własności metali).pdf','Reakcje metali z kwasami i kwasy utleniające'],
['X','X. 6 (reakcje redoks, właściwości Mn i Cr).pdf','Reakcje redoks — Mn i Cr'],
['IX','09_IX._chemia_organiczna_weglowodory.pdf','Węglowodory'],
['X','10_X._pochodne_weglowodorow.pdf','Pochodne węglowodorów'],
['XI','11_XI._zwiazki_organiczne_zawierajace_azot.pdf','Związki organiczne zawierające azot'],
['XII','12_XII._biomolekuly.pdf','Biomolekuły'],
['XIII','13_XIII._chemia_polimerow.pdf','Chemia polimerów'],
['XIV','14_XIV._chemia_w_praktyce.pdf','Chemia w praktyce'],
['XV','15_XV._analiza_chemiczna.pdf','Analiza chemiczna'],
['XVI','16_XVI._doswiadczenia_chemiczne.pdf','Doświadczenia chemiczne'],
['XVII','17_XVII._obliczenia_chemiczne.pdf','Obliczenia chemiczne'],
['XVIII','18_XVIII._elektrochemia.pdf','Elektrochemia'],
['XIX','19_XIX._chemia_srodowiska.pdf','Chemia środowiska'],
['XX','20_XX._chemia_przemyslowa.pdf','Chemia przemysłowa'],
['XXI','21_XXI._powtorki.pdf','Powtórki'],
['XXII','22_XXII._zadania.pdf','Zadania']
];
const titles={I:'Atomy, cząsteczki i stechiometria chemiczna.',II:'Budowa atomu.',III:'Wiązania chemiczne. Oddziaływania międzycząsteczkowe.',IV:'Kinetyka i statyka chemiczna. Energetyka reakcji chemicznych.',V:'Roztwory.',VI:'Reakcje w roztworach wodnych.',VII:'Systematyka związków nieorganicznych.',VIII:'Reakcje utleniania i redukcji.',IX:'Związki organiczne.',X:'Systematyka związków organicznych.',XI:'Związki organiczne zawierające azot.',XII:'Biomolekuły.',XIII:'Polimery.',XIV:'Chemia w praktyce.',XV:'Analiza chemiczna.',XVI:'Doświadczenia chemiczne.',XVII:'Obliczenia chemiczne.',XVIII:'Elektrochemia.',XIX:'Chemia środowiska.',XX:'Chemia przemysłowa.',XXI:'Powtórzenie materiału.',XXII:'Zadania.'};
const romans=Object.keys(titles);const by={};notes.forEach(n=>(by[n[0]]??=[]).push(n));
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fileUrl(name){return 'notatki/'+encodeURIComponent(name)}
function noteCards(r){const a=by[r]||[];return a.length?'<div class="notes">'+a.map(n=>`<div class="note-card"><h3>${esc(n[2])}</h3><div class="note-actions"><button onclick="openViewer(${JSON.stringify(fileUrl(n[1]))},${JSON.stringify(n[2])})">Otwórz w stronie</button><a href="${fileUrl(n[1])}" target="_blank">Otwórz PDF</a></div></div>`).join('')+'</div>':'<div class="no-notes">Brak przypisanych notatek.</div>'}
function render(){chapters.innerHTML=romans.map(r=>`<section class="chapter" data-roman="${r}"><div class="chapter-head" onclick="toggleChapter(this.parentElement)"><span class="badge">${r}</span><h2>${titles[r]}</h2><span class="count">${(by[r]||[]).length} not.</span><span class="arrow">›</span></div><div class="chapter-body">${noteCards(r)}</div></section>`).join('');nav.innerHTML=romans.map(r=>`<a href="#${r}" onclick="document.getElementById('${r}').scrollIntoView();return false">${r} — ${titles[r]}</a>`).join('');}
function toggleChapter(x){x.classList.toggle('open')}function openAll(){document.querySelectorAll('.chapter').forEach(x=>x.classList.add('open'))}function closeAll(){document.querySelectorAll('.chapter').forEach(x=>x.classList.remove('open'))}function showOnlyNotes(){document.querySelectorAll('.chapter').forEach(x=>x.style.display=by[x.dataset.roman]?.length?'':'none')}function resetFilter(){document.querySelectorAll('.chapter').forEach(x=>x.style.display='');search.value='';filter()}function filter(){const q=search.value.trim().toLowerCase();let v=0;document.querySelectorAll('.chapter').forEach(x=>{const ok=!q||x.innerText.toLowerCase().includes(q);x.style.display=ok?'':'none';if(ok)v++});empty.style.display=v?'none':'block'}function openViewer(file,title){viewerTitle.textContent=title;pdfFrame.src=file;viewer.classList.add('open');document.body.style.overflow='hidden'}function closeViewer(){viewer.classList.remove('open');pdfFrame.src='';document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});search.addEventListener('input',filter);render();
</script></body></html>
