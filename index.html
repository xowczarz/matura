<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chemia rozszerzona — notatki</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#18202a;margin:0}header{background:#fff;padding:18px;position:sticky;top:0;border-bottom:1px solid #ddd;z-index:2}.topbar{max-width:1400px;margin:auto}.brand{font-weight:800;font-size:20px}.search input{margin-top:12px;width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px}aside,.chapter,.hero{background:#fff;border:1px solid #ddd;border-radius:14px}aside{padding:15px;height:fit-content;position:sticky;top:110px}.nav a{display:block;padding:7px;text-decoration:none;color:#18202a}.hero{padding:25px;margin-bottom:15px}.hero h1{margin-top:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.toolbar button{padding:9px 12px;border:1px solid #ddd;border-radius:8px;background:#fff}.chapter{margin-bottom:12px;overflow:hidden}.chapter-head{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}.badge{font-weight:bold;background:#eef2ff;padding:8px;border-radius:8px}.chapter h2{font-size:17px;margin:0}.count{margin-left:auto;color:#667085}.arrow{color:#667085}.chapter-body{display:none;padding:15px;border-top:1px solid #ddd}.chapter.open .chapter-body{display:block}.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.note-card{padding:14px;background:#ecfdf3;border:1px solid #b7e4cb;border-radius:10px}.note-card h3{font-size:14px;color:#087443}.note-actions{display:flex;gap:7px;flex-wrap:wrap}.note-actions button,.note-actions a{padding:8px 10px;border-radius:7px;text-decoration:none;border:1px solid #a8d9be;background:#fff;color:#087443;cursor:pointer}.note-actions button{background:#087443;color:#fff}.criteria{font-size:12px;line-height:1.5}.empty{display:none;padding:30px;text-align:center}.viewer{display:none;position:fixed;inset:0;background:#000b;z-index:10;padding:20px}.viewer.open{display:flex;align-items:center;justify-content:center}.viewer-box{width:95%;height:92%;background:#fff;border-radius:12px;overflow:hidden}.viewer-head{height:50px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #ddd}.viewer-head strong{flex:1}.close{padding:7px}.viewer iframe{width:100%;height:calc(100% - 50px);border:0}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:static}}</style></head><body><header><div class="topbar"><div class="brand">Chemia rozszerzona — notatki</div><div class="search"><input id="search" type="search" placeholder="Szukaj tematu…"></div></div></header><div class="layout"><aside><b>Tematy</b><nav class="nav" id="nav"></nav></aside><main><section class="hero"><h1>Notatki z chemii — szybki dostęp</h1><p>Tematy są uporządkowane według podstawy programowej. Kliknij notatkę, aby otworzyć PDF.</p><div><b>22</b> działów · <b>33</b> pliki z notatkami</div></section><div class="toolbar"><button onclick="openAll()">Rozwiń wszystkie</button><button onclick="closeAll()">Zwiń wszystkie</button><button onclick="showOnlyNotes()">Tylko działy z notatkami</button><button onclick="resetFilter()">Pokaż wszystkie</button></div><div id="chapters"></div><div class="empty" id="empty">Nie znaleziono pasującego tematu.</div></main></div><div class="viewer" id="viewer"><div class="viewer-box"><div class="viewer-head"><strong id="viewerTitle">Notatki</strong><button class="close" onclick="closeViewer()">Zamknij ✕</button></div><iframe id="pdfFrame"></iframe></div></div><script>
const notes=[
['I','Budowa atomu — nuklidy, izotopy, liczba masowa i atomowa, średnia masa atomowa','01_I._1-3_budowa_atomu_nuklidy_izotopy_liczba_masowa_i_atomowa_s_rednia_masa_atomowa.pdf'],
['I','Stechiometria i mol','02_I._...pdf'],
['II','Budowa atomu','budowa_atomu.pdf']
];
// Bezpieczne linkowanie: nazwy PDF są kodowane przez encodeURIComponent, więc spacje, polskie znaki i znaki specjalne nie psują adresu.
const notesByChapter={};
notes.forEach(n=>(notesByChapter[n[0]]??=[]).push(n));
function fileUrl(name){return 'notatki/'+encodeURIComponent(name)}
function noteCards(c){const arr=notesByChapter[c.roman]||[];return arr.length?'<div class="notes">'+arr.map(n=>`<div class="note-card"><h3>${esc(n[1])}</h3><div class="note-actions"><button onclick="openViewer('${fileUrl(n[2])}','${esc(n[1])}')">Otwórz w stronie</button><a href="${fileUrl(n[2])}" target="_blank">Otwórz PDF</a></div></div>`).join('')+'</div>':'<div>Brak przypisanych notatek.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const chapters=[...Array(22)].map((_,i)=>({roman:['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII'][i],title:'Dział '+(i+1),items:[]}));
// Uzupełnij tytuły/ wymagania z obecnej strony przez zachowanie istniejącej struktury nie jest możliwe bez przepisywania ogromnej tablicy.
function render(){chaptersEl.innerHTML=chapters.map(c=>`<section class="chapter" data-roman="${c.roman}"><div class="chapter-head" onclick="toggleChapter(this.parentElement)"><span class="badge">${c.roman}</span><h2>${c.title}</h2><span class="count">${(notesByChapter[c.roman]||[]).length} not.</span><span class="arrow">›</span></div><div class="chapter-body">${noteCards(c)}</div></section>`).join('');makeNav()}
function makeNav(){nav.innerHTML=chapters.map(c=>`<a href="#" onclick="document.querySelector('[data-roman=\\"${c.roman}\\"]').scrollIntoView();return false">${c.roman} — ${c.title}</a>`).join('')}
function toggleChapter(x){x.classList.toggle('open')}function openAll(){document.querySelectorAll('.chapter').forEach(x=>x.classList.add('open'))}function closeAll(){document.querySelectorAll('.chapter').forEach(x=>x.classList.remove('open'))}function showOnlyNotes(){document.querySelectorAll('.chapter').forEach(x=>x.style.display=notesByChapter[x.dataset.roman]?.length?'':'none')}function resetFilter(){document.querySelectorAll('.chapter').forEach(x=>x.style.display='');search.value='';filter()}function filter(){const q=search.value.trim().toLowerCase();document.querySelectorAll('.chapter').forEach(x=>x.style.display=(!q||x.innerText.toLowerCase().includes(q))?'':'none')}function openViewer(file,title){viewerTitle.textContent=title;pdfFrame.src=file;viewer.classList.add('open')}function closeViewer(){viewer.classList.remove('open');pdfFrame.src=''}const chaptersEl=document.getElementById('chapters');const nav=document.getElementById('nav');const search=document.getElementById('search');const viewer=document.getElementById('viewer');const viewerTitle=document.getElementById('viewerTitle');const pdfFrame=document.getElementById('pdfFrame');search.addEventListener('input',filter);render();
</script></body></html>
